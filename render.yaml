# Render blueprint — deploys the StudyForge FastAPI backend as a free web service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: studyforge-api
    runtime: docker          # Docker so we can install the Tesseract OCR engine
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false          # set in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STUDYFORGE_SECRET_KEY
        generateValue: true  # Render generates a strong random value
      - key: YOUTUBE_API_KEY
        sync: false
